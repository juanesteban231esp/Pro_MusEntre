name: 'port_databricks'
version: '1.0.0'
config-version: 2

# Este nombre debe coincidir exactamente con el bloque principal de tu archivo profiles.yml
profile: 'Pro_MusEntre'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  port_databricks:
    staging:
      +schema: silver
      +materialized: view

    intermediate:
      +schema: silver
      +materialized: view

    marts: # Si tu carpeta física se llama 'mars', déjalo como 'mars'
      +schema: gold
      +materialized: table